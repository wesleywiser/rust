[package]
name = "rustc_codegen_arm64"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["dylib"]

[dependencies]
# tidy-alphabetical-start
gimli = { version = "0.31.1", default-features = false, features = ["write"] }
object = { version = "0.39.1", default-features = false, features = ["std", "read_core", "write", "macho"] }
smallvec = "1.8.1"
tracing = "0.1"
# tidy-alphabetical-end

# Use the local `object` prototype that adds aarch64 `ARM64_RELOC_POINTER_TO_GOT` support, which the
# `__eh_frame` personality relocation for unwinding requires (upstream 0.39.1 cannot emit it). Remove
# once the fix is released upstream.
[patch.crates-io]
object = { path = "/Users/wesley/Code/object" }
